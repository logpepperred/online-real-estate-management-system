<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header('System Settings')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: alerts}"></div>

<div class="container-fluid px-4 py-4">
    <div class="row">
        <!-- Sidebar Navigation -->
        <div class="col-lg-2 mb-4">
            <div class="card border-0 shadow-sm p-3" style="border-radius: 12px;">
                <ul class="nav flex-column gap-1">
                    <li class="nav-item">
                        <a class="nav-link text-secondary" th:href="@{/admin/dashboard}"><i class="bi bi-speedometer2 me-2"></i> Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-secondary" th:href="@{/admin/users}"><i class="bi bi-people me-2"></i> User Management</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-secondary" th:href="@{/admin/properties}"><i class="bi bi-houses me-2"></i> Property Approvals</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-secondary" th:href="@{/admin/activity-logs}"><i class="bi bi-clock-history me-2"></i> Activity Logs</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active fw-semibold text-primary" th:href="@{/admin/settings}"><i class="bi bi-gear me-2"></i> System Settings</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-secondary" th:href="@{/admin/reports}"><i class="bi bi-graph-up-arrow me-2"></i> Reports &amp; Analytics</a>
                    </li>
                </ul>
            </div>
        </div>

        <!-- Main Content -->
        <div class="col-lg-10">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h3 class="fw-bold mb-1">System Configuration &amp; Settings</h3>
                    <p class="text-muted mb-0">Configure system-wide parameters, fees, contact options, and system modes.</p>
                </div>
            </div>

            <div class="card border-0 shadow-sm p-4" style="border-radius: 12px; max-width: 900px;">
                <form th:action="@{/admin/settings/update}" method="post">
                    <div class="row g-4">
                        <div class="col-md-6" th:each="setting : ${settings}">
                            <div class="card bg-light border-0 p-3 h-100">
                                <label class="form-label fw-bold text-dark text-capitalize" th:text="${#strings.replace(setting.settingKey, '_', ' ')}">Setting Key</label>
                                <p class="text-muted small mb-2" th:text="${setting.description}">Setting description</p>
                                <div class="mt-auto">
                                    <input type="text" th:name="${setting.settingKey}" th:value="${setting.settingValue}" class="form-control" required>
                                    <small class="badge bg-secondary-subtle text-secondary mt-2" th:text="'Category: ' + ${setting.category}">GENERAL</small>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="mt-4 pt-3 border-top text-end">
                        <button type="submit" class="btn btn-primary px-4 py-2 fw-semibold">
                            <i class="bi bi-save me-1"></i> Save Configuration Settings
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
