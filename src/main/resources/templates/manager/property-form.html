<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header(${isEdit ? 'Edit Property' : 'Add New Property'})}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: alerts}"></div>

<div class="container py-4" style="max-width: 850px;">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h3 class="fw-bold mb-1" th:text="${isEdit ? 'Edit Property Listing' : 'Create New Property Listing'}">Property Listing</h3>
            <p class="text-muted mb-0">Provide property details, rent amount, specifications, and images.</p>
        </div>
        <a th:href="@{/manager/properties}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left me-1"></i> Back to Properties
        </a>
    </div>

    <div class="card border-0 shadow-sm p-4" style="border-radius: 14px;">
        <form th:action="${isEdit ? '/manager/properties/update/' + property.id : '/manager/properties/save'}"
              th:object="${property}" method="post">

            <div class="mb-3">
                <label class="form-label fw-semibold">Listing Title</label>
                <input type="text" th:field="*{title}" class="form-control" placeholder="e.g. Modern Sunset Villa with Private Garden" required>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold">Property Type</label>
                    <select th:field="*{propertyType}" class="form-select" required>
                        <option value="Apartment">Apartment</option>
                        <option value="Villa">Villa</option>
                        <option value="Condo">Condo</option>
                        <option value="Studio">Studio</option>
                        <option value="Townhouse">Townhouse</option>
                        <option value="Single Family Home">Single Family Home</option>
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold">Monthly Rent ($)</label>
                    <div class="input-group">
                        <span class="input-group-text">$</span>
                        <input type="number" step="0.01" th:field="*{price}" class="form-control" placeholder="2500.00" required>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label fw-semibold">Security Deposit ($)</label>
                    <div class="input-group">
                        <span class="input-group-text">$</span>
                        <input type="number" step="0.01" th:field="*{securityDeposit}" class="form-control" placeholder="2500.00">
                    </div>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label fw-semibold">Bedrooms</label>
                    <input type="number" th:field="*{bedrooms}" class="form-control" min="1" max="10" required>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label fw-semibold">Bathrooms</label>
                    <input type="number" th:field="*{bathrooms}" class="form-control" min="1" max="10" required>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold">Area (Square Feet)</label>
                    <input type="number" step="0.1" th:field="*{areaSqFt}" class="form-control" placeholder="e.g. 1200">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold">Image URL</label>
                    <input type="url" th:field="*{imageUrl}" class="form-control" placeholder="https://example.com/photo.jpg">
                    <small class="text-muted">Direct image URL (e.g., Unsplash or hosting link)</small>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Street Address</label>
                <input type="text" th:field="*{address}" class="form-control" placeholder="e.g. 123 Main Street, Suite 400" required>
            </div>

            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label fw-semibold">City</label>
                    <input type="text" th:field="*{city}" class="form-control" placeholder="e.g. Austin" required>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label fw-semibold">State</label>
                    <input type="text" th:field="*{state}" class="form-control" placeholder="e.g. TX" required>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label fw-semibold">Zip Code</label>
                    <input type="text" th:field="*{zipCode}" class="form-control" placeholder="78704">
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label fw-semibold">Property Description &amp; Amenities</label>
                <textarea th:field="*{description}" class="form-control" rows="5"
                          placeholder="Highlight amenities, pet policies, utilities, parking, and building features..." required></textarea>
            </div>

            <div class="d-flex justify-content-end gap-2">
                <a th:href="@{/manager/properties}" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary px-4 fw-semibold">
                    <i class="bi bi-cloud-arrow-up me-1"></i> <span th:text="${isEdit ? 'Update Listing' : 'Submit for Admin Approval'}">Submit</span>
                </button>
            </div>
        </form>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
