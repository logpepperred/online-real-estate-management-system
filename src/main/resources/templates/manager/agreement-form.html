<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header('Issue Rental Agreement')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: alerts}"></div>

<div class="container py-4" style="max-width: 800px;">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h3 class="fw-bold mb-1">Issue New Rental Agreement</h3>
            <p class="text-muted mb-0">Set monthly rent, deposit, lease start/end dates, and terms of tenancy.</p>
        </div>
        <a th:href="@{/manager/agreements}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left me-1"></i> Back to Agreements
        </a>
    </div>

    <div class="card border-0 shadow-sm p-4" style="border-radius: 14px;">
        <form th:action="@{/manager/agreements/save}" th:object="${agreement}" method="post">

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold">Select Property</label>
                    <select name="propertyId" class="form-select" required>
                        <option value="">-- Choose Managed Property --</option>
                        <option th:each="prop : ${myProperties}"
                                th:value="${prop.id}"
                                th:text="${prop.title} + ' ($' + ${prop.price} + '/mo)'"
                                th:selected="${agreement.property != null and agreement.property.id == prop.id}">
                            Property Title
                        </option>
                    </select>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold">Select Tenant</label>
                    <select name="tenantId" class="form-select" required>
                        <option value="">-- Choose Tenant --</option>
                        <option th:each="t : ${tenants}"
                                th:value="${t.id}"
                                th:text="${t.name} + ' (' + ${t.email} + ')'"
                                th:selected="${agreement.tenant != null and agreement.tenant.id == t.id}">
                            Tenant Name
                        </option>
                    </select>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold">Lease Start Date</label>
                    <input type="date" th:field="*{startDate}" class="form-control" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold">Lease End Date</label>
                    <input type="date" th:field="*{endDate}" class="form-control" required>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold">Agreed Monthly Rent ($)</label>
                    <div class="input-group">
                        <span class="input-group-text">$</span>
                        <input type="number" step="0.01" th:field="*{monthlyRent}" class="form-control" placeholder="2500.00" required>
                    </div>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold">Security Deposit ($)</label>
                    <div class="input-group">
                        <span class="input-group-text">$</span>
                        <input type="number" step="0.01" th:field="*{securityDeposit}" class="form-control" placeholder="2500.00">
                    </div>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label fw-semibold">Terms and Conditions</label>
                <textarea th:field="*{termsAndConditions}" class="form-control" rows="5"
                          placeholder="Specify payment deadlines, notice period, pet guidelines, maintenance responsibilities...">1. Rent is due on the 1st of each calendar month.
2. Tenant must give 30-day written notice prior to termination.
3. No unauthorized subletting permitted.
4. Routine maintenance handled by property management.</textarea>
            </div>

            <div class="d-flex justify-content-end gap-2">
                <a th:href="@{/manager/agreements}" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary px-4 fw-semibold">
                    <i class="bi bi-file-earmark-check me-1"></i> Issue &amp; Activate Agreement
                </button>
            </div>
        </form>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
